[build]
  # Directory to change to before starting a build
  base = "."
  
  # Directory that contains the deploy-ready HTML files and assets generated by the build
  publish = "dist"
  
  # Default build command
  command = "npm run build"

# SPA (Single Page Application) redirect rules
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    # Security headers
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https:;"
    
    # Performance headers
    Cache-Control = "public, max-age=31536000, immutable"

# Cache headers for HTML files (don't cache aggressively)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Cache headers for service worker
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Cache headers for static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Redirect www to non-www
[[redirects]]
  from = "https://www.buffbyteai.xyz/*"
  to = "https://buffbyteai.xyz/:splat"
  status = 301
  force = true

# Redirect old domain if needed (optional - remove if not needed)
[[redirects]]
  from = "https://bufbyte.xyz/*"
  to = "https://buffbyteai.xyz/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.bufbyte.xyz/*"
  to = "https://buffbyteai.xyz/:splat"
  status = 301
  force = true
